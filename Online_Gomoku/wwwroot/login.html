
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用户登录 - 五子棋</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #101b1a;
    color: #f5f5ef;
}
.card {
    width: 400px;
    max-width: calc(100% - 32px);
    padding: 40px;
    background: #1b2a27;
    border: 1px solid #35463f;
    border-radius: 16px;
}
h1 { margin-bottom: 8px; }
.subtitle { color: #a4b4aa; margin-bottom: 32px; }
label { display: block; margin: 18px 0 9px; }
input {
    width: 100%;
    padding: 14px;
    border: 1px solid #43564d;
    border-radius: 8px;
    background: #111e1a;
    color: white;
    font-size: 15px;
}
input:focus { outline: 1px solid #b9df8a; }
button {
    width: 100%;
    margin-top: 28px;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: #b9df8a;
    color: #142019;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}
button:hover { background: #d0efa9; }
.links {
    text-align: center;
    margin-top: 25px;
    color: #a4b4aa;
}
a { color: #b9df8a; text-decoration: none; }
.back { display: block; margin-top: 20px; text-align: center; }
#error { color: #ff9e9e; margin-top: 15px; }
</style>
</head>
<body>
<div class="card">
    <h1>欢迎回来</h1>
    <p class="subtitle">登录账号，继续你的五子棋对战</p>

    <form id="loginForm" action = "/Login" method="get ">
        <label for="username">用户名</label>
        <input id="username" name="username" type="text" 
               placeholder="请输入用户名"
               autocomplete="username" required>

        <label for="password">密码</label>
        <input id="password" name="password" type="password"
               placeholder="请输入密码"
               autocomplete="current-password" required>

        <button type="submit">登录</button>
        <p id="error" role="status"></p>
    </form>

    <div class="links">
        还没有账号？<a href="/register.html">立即注册</a>
    </div>
    <a class="back" href="/">返回首页</a>
</div>


</body>
</html>
